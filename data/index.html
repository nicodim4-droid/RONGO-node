<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONGO NODE</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>RONGO NODE ONLINE</h1>

    <div class="row"><span class="label">Temperature:</span> <span id="temp">--</span> °C</div>
    <div class="row"><span class="label">Humidity:</span>    <span id="hum">--</span> %</div>
    <div class="row"><span class="label">Uptime:</span>      <span id="uptime">--</span> s</div>

    <hr>

    <div class="row"><span class="label">IP:</span>          <span id="ip">--</span></div>
    <div class="row"><span class="label">RSSI:</span>        <span id="rssi">--</span> dBm</div>
    <div class="row"><span class="label">Firmware:</span>    <span id="fw">--</span></div>
    <div class="row"><span class="label">Sensor:</span>      <span id="sensor">--</span></div>

    <script src="/app.js"></script>
</body>
</html>
